services:
  - type: web
    name: hackz-mosa-back
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hackz-mosa-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        value: hackz-mosacup
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: CORS_ALLOWED_ORIGINS
        value: https://hackzmosa.yellowtail.work

databases:
  - name: hackz-mosa-db
    plan: free
    region: singapore
    databaseName: hackz_mosa
    user: hackz_mosa
    postgresMajorVersion: "17"
    ipAllowList: []
